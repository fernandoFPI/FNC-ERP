version: '3.9'

services:
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fnc_erp_test
      POSTGRES_USER: fnc_app
      POSTGRES_PASSWORD: test_password
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fnc_app -d fnc_erp_test']
      interval: 5s
      timeout: 5s
      retries: 5
